name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build-time QA gate (storyboard §9.2b). Runs BEFORE the build so a
      # content regression blocks the deploy rather than shipping.
      - name: QA gate
        run: npm run qa
      # Drives the UI and walks every unit end to end. Catches the class of
      # defect that compiles cleanly and passes the QA gate while leaving a
      # learner unable to get past a screen.
      - name: Completability tests
        run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
